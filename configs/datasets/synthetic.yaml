# Synthetic stand-in dataset - PIPELINE VERIFICATION ONLY.
#
# Generated by scripts/make_synthetic_dataset.py. The classes are separated by an
# artificial coloured lesion, so any accuracy measured here says nothing about real
# dermatology performance. Its purpose is to let you confirm that prepare -> train ->
# evaluate -> explain -> serve all work before the real download is in place.

name: synthetic
description: Synthetic stand-in for pipeline verification. Not a real dataset.

source:
  kind: manual
  identifier: scripts/make_synthetic_dataset.py

raw_dir: data/raw/synthetic
manifest_path: data/processed/synthetic/manifest.csv
image_extensions: [".jpg", ".jpeg", ".png"]
min_images_per_class: 10

classes:
  - key: bacterial_dermatosis
    display_name: Bacterial dermatosis
    aliases: ["bacterial dermatosis", "bacterial"]
    summary: Synthetic class - solid red circular lesion.
    colour: "#e8743b"
  - key: fungal_infections
    display_name: Fungal infections
    aliases: ["fungal infections", "fungal"]
    summary: Synthetic class - purple ring lesion.
    colour: "#9b6bd6"
  - key: hypersensitivity_allergic_dermatosis
    display_name: Hypersensitivity allergic dermatosis
    aliases: ["hypersensitivity allergic dermatosis", "hypersensitivity"]
    summary: Synthetic class - irregular yellow patch.
    colour: "#dcb63b"
  - key: healthy
    display_name: Healthy
    aliases: ["healthy", "normal"]
    summary: Synthetic class - background only, no lesion.
    colour: "#3fa66b"

split:
  val_size: 0.15
  test_size: 0.15
  stratify: true
  # The generator embeds an animal id in each filename, so grouping is exercised here.
  group_pattern: '^[Dd]og(\d+_\d+_\d+)_\d+$'
